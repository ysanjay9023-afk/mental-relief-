<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>मानसिक राहत - शांत मन का ठिकाना</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            max-width: 450px;
            text-align: center;
            border: 1px solid #334155;
        }
        h2 {
            color: #38bdf8;
            margin-bottom: 10px;
        }
        p {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #cbd5e1;
            margin: 20px 0;
            min-height: 80px;
        }
        button {
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #0ea5e9;
        }
        .footer {
            margin-top: 20px;
            font-size: 0.8rem;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>आज का मानसिक बोझ हल्का करें</h2>
        <p id="thought-box">दिनभर की भागदौड़ के बाद, यहाँ बस एक गहरी सांस लीजिए। आप जो भी सोच रहे हैं, उसे यहीं छोड़ दीजिए। सब ठीक हो जाएगा।</p>
        <button onclick="changeThought()">एक सुकून भरा विचार देखें</button>
        <div class="footer">100% ऑटोमैटिक • कोई साइन-अप नहीं • पूरी तरह निजी</div>
    </div>

    <script>
        const thoughts = [
            "आज जो काम छूट गया, वह कल भी हो जाएगा। इस समय सिर्फ आपका आराम जरूरी है। फोन को किनारे रखिए और गहरी सांस लीजिए।",
            "दूसरों की उम्मीदों पर खरा उतरने की दौड़ में खुद को मत थकाइये। आज का दिन खत्म हो चुका है, कल की शुरुआत नए सिरे से होगी।",
            "दिमाग को खाली छोड़ना कमजोरी नहीं, ताकत है। आज रात कोई बड़ी प्लानिंग मत कीजिए, बस चैन की नींद सोइए।",
            "आप अकेले नहीं हैं जो इस तनाव से गुजर रहे हैं। हर थके हुए इंसान को इस वक्त इसी शांति की जरूरत है।",
            "जितना आप सोच रहे हैं, चीजें उतनी मुश्किल नहीं हैं। सुबह की रोशनी में सब साफ दिखाई देगा। अभी आराम कीजिए।"
        ];

        function changeThought() {
            const randomIndex = Math.floor(Math.random() * thoughts.length);
            document.getElementById("thought-box").innerText = thoughts[randomIndex];
        }
    </script>

</body>
</html>
